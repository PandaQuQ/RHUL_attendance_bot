[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rhul-attendance-bot"
version = "0.1.49"
description = "RHUL attendance automation bot"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "PandaQuQ"}]
keywords = ["automation", "attendance", "selenium", "rhul"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "ics",
    "rich",
    "selenium",
    "webdriver-manager",
    "pynput",
    "ntplib",
    "pyotp",
]

[project.urls]
Repository = "https://github.com/PandaQuQ/RHUL_attendance_bot"

[project.scripts]
rhul-attendance-bot = "RHUL_attendance_bot:main"

[tool.setuptools]
py-modules = [
    "RHUL_attendance_bot",
    "auto_login",
    "display_manager",
    "update",
    "app_paths",
    "fetch_ics",
    "local_2fa",
    "discord_broadcast",
]
