name: Auto Tag Patch Version

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create next patch tag
        run: |
          latest_tag=$(git tag --list 'v*' --sort=-v:refname | head -n 1 || true)
          if [ -z "$latest_tag" ]; then
            major=0
            minor=0
            patch=0
          else
            version=${latest_tag#v}
            IFS='.' read -r major minor patch <<EOF
          $version
          EOF
            : "${major:=0}" "${minor:=0}" "${patch:=0}"
          fi
          patch=$((patch + 1))
          new_tag="v${major}.${minor}.${patch}"
          if git rev-parse -q --verify "refs/tags/${new_tag}" >/dev/null 2>&1; then
            echo "Tag ${new_tag} already exists."
            exit 0
          fi
          git tag "${new_tag}"
          git push origin "${new_tag}"
          echo "NEW_TAG=${new_tag}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Sync version from tag
        run: |
          python - <<'PY'
          import os
          import re
          import pathlib

          tag = os.environ.get("NEW_TAG", "")
          if not tag:
              raise SystemExit("NEW_TAG is missing")
          version = tag.lstrip("v")
          if not re.match(r"^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.]+)?$", version):
              raise SystemExit(f"Invalid tag for version: {tag}")

          path = pathlib.Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          text = re.sub(r"(?m)^version\s*=\s*\".*\"$", f'version = "{version}"', text)
          path.write_text(text, encoding="utf-8")
          print(f"Set version to {version}")
          PY

      - name: Build package
        run: python -m build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_TAG }}
          name: ${{ env.NEW_TAG }}
          generate_release_notes: true
          files: |
            dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/*
